name: React Native CI (Env Based)

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  android-build:
    runs-on: ubuntu-latest

    # ✅ GitHub Environment (EXACT MATCH WITH UI)
    environment:
      name: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}

    env:
      NODE_ENV: production

    steps:
      # ------------------------------------
      # Checkout code
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------
      # Set ENV_FILE dynamically based on branch
      # ------------------------------------
      - name: Set ENV_FILE based on branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_FILE=.env.production" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "ENV_FILE=.env.staging" >> $GITHUB_ENV
          else
            echo "ENV_FILE=.env.development" >> $GITHUB_ENV
          fi

      - name: Verify ENV_FILE
        run: |
          echo "ENV_FILE is set to: $ENV_FILE"
          ls -l $ENV_FILE

      - name: Copy env file
        run: |
          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" .env
            echo "Copied $ENV_FILE to .env"
            echo "Contents of .env:"
            cat .env
          else
            echo "Env file $ENV_FILE does not exist!"
            exit 1
          fi

      # ------------------------------------
      # Setup Node.js
      # ------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------
      # Setup Java (Android)
      # ------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------
      # Cache npm
      # ------------------------------------
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ------------------------------------
      # Cache Gradle
      # ------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ------------------------------------
      # Install dependencies and fix CLI
      # ------------------------------------
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --legacy-peer-deps
          
          echo "Installing compatible React version for React Native 0.83..."
          npm install react@18.3.1 react-test-renderer@18.3.1 --legacy-peer-deps
          
          echo "Ensuring React Native CLI is available..."
          if ! npx react-native --version > /dev/null 2>&1; then
            echo "Installing React Native CLI..."
            npm install @react-native-community/cli@latest --save-dev --legacy-peer-deps
          fi
          
          echo "Verifying React Native CLI..."
          npx react-native --version || echo "CLI verification failed, but continuing..."

      # ------------------------------------
      # Post-install fixes
      # ------------------------------------
      - name: Post-install fixes
        run: |
          echo "Running post-install fixes..."
          ls -la node_modules/react-native-config/android/build.gradle || echo "react-native-config Android files missing"
          cp "$ENV_FILE" .env || echo "Environment file copy failed"
          echo "✅ Post-install fixes completed"

      - name: Verify setup
        run: |
          echo "=== Verification Steps ==="
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "React version:"
          npm list react --depth=0 || echo "React version check failed"
          echo "Checking react-native-config..."
          ls -la node_modules/react-native-config/android/ | head -5 || echo "react-native-config not found"
          echo "Checking AndroidManifest.xml..."
          grep "package=" android/app/src/main/AndroidManifest.xml || echo "Package not found"
          echo "=== Setup verification complete ==="

      # ------------------------------------
      # Fix Metro compatibility issues
      # ------------------------------------
      - name: Fix Metro compatibility for Node.js 20
        run: |
          echo "Patching Metro config for Node.js 20 compatibility..."
          sed -i 's/configs\.toReversed()/configs.slice().reverse()/g' node_modules/metro-config/src/loadConfig.js
          sed -i 's/reversedConfigs\.toReversed()/reversedConfigs.slice().reverse()/g' node_modules/metro-config/src/loadConfig.js
          echo "Metro config patched successfully"

      # ------------------------------------
      # Ensure autolinking works
      # ------------------------------------
      - name: Ensure autolinking configuration
        run: |
          echo "Checking React Native configuration..."
          cat react-native.config.js
          echo "Testing React Native CLI..."
          npx react-native config --platform android || echo "CLI failed, continuing..."
          echo "Verifying AndroidManifest.xml..."
          grep "package=" android/app/src/main/AndroidManifest.xml || echo "Package not found"

      # ------------------------------------
      # Android Build based on branch
      # ------------------------------------
      - name: Prepare Android build
        run: |
          echo "Preparing Android build environment..."
          cd android
          echo "Cleaning previous builds..."
          ./gradlew clean --warning-mode none
          chmod +x gradlew
          echo "Gradle wrapper version:"
          ./gradlew --version --warning-mode none
          echo "Android project structure:"
          ls -la app/src/main/
          echo "Skipping autolinking test (not required for build success)"
          echo "Build preparation complete"

      - name: Build Android APK
        run: |
          cd android
          echo "Starting Android build process..."
          ./gradlew clean --warning-mode none
          echo "Building APK for branch: ${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            "main")
              echo "Building production release APK..."
              ./gradlew assembleProductionRelease --warning-mode none --continue
              ;;
            "staging")
              echo "Building staging release APK..."
              ./gradlew assembleStagingRelease --warning-mode none --continue
              ;;
            *)
              echo "Building development debug APK..."
              ./gradlew assembleDevelopmentDebug --warning-mode none --continue
              ;;
          esac
          echo "Build process completed"

      - name: Verify APK exists
        run: |
          echo "Checking for built APK files..."
          find android/app/build/outputs/apk -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/*/

      # ------------------------------------
      # Upload Artifact based on branch
      # ------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/app-*.apk