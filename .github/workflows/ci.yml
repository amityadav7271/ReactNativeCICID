name: React Native CI (Env Based)

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  android-build:
    runs-on: ubuntu-latest

    # ✅ GitHub Environment (EXACT MATCH WITH UI)
    environment:
      name: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}

    env:
      NODE_ENV: production

    steps:
      # ------------------------------------
      # Checkout code
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------
      # Set ENV_FILE dynamically based on branch
      # ------------------------------------
      - name: Set ENV_FILE based on branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_FILE=.env.production" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "ENV_FILE=.env.staging" >> $GITHUB_ENV
          else
            echo "ENV_FILE=.env.development" >> $GITHUB_ENV
          fi

      - name: Verify ENV_FILE
        run: |
          echo "ENV_FILE is set to: $ENV_FILE"
          ls -l $ENV_FILE

      - name: Copy env file
        run: |
          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" .env
            echo "Copied $ENV_FILE to .env"
            echo "Contents of .env:"
            cat .env
          else
            echo "Env file $ENV_FILE does not exist!"
            exit 1
          fi

      # ------------------------------------
      # Setup Node.js
      # ------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------
      # Setup Java (Android)
      # ------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------
      # Cache npm
      # ------------------------------------
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ------------------------------------
      # Cache Gradle
      # ------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ------------------------------------
      # Install dependencies
      # ------------------------------------
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ------------------------------------
      # Fix React version compatibility
      # ------------------------------------
      - name: Fix React version compatibility
        run: |
          echo "Installing compatible React version for React Native 0.83..."
          npm install react@18.3.1 react-test-renderer@18.3.1 --legacy-peer-deps
          echo "React version fixed"

      # ------------------------------------
      # Fix React Native CLI
      # ------------------------------------
      - name: Fix React Native CLI
        run: |
          echo "Ensuring React Native CLI works properly..."
          npm install -g @react-native-community/cli@latest
          npx react-native --version
          npx react-native config --reset-cache || echo "Cache reset failed, continuing..."

      # ------------------------------------
      # Post-install fixes
      # ------------------------------------
      - name: Post-install fixes
        run: |
          echo "Running post-install fixes..."
          if [ -f node_modules/react-native-config/android/build.gradle ]; then
            echo "✅ react-native-config Android files found"
          else
            echo "❌ react-native-config Android files missing"
            exit 1
          fi

          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" .env
            echo "✅ Environment file copied: $ENV_FILE -> .env"
          else
            echo "❌ Environment file not found: $ENV_FILE"
            exit 1
          fi

      - name: Verify setup
        run: |
          echo "=== Verification Steps ==="
          echo "Node and npm versions:"
          node --version
          npm --version
          echo ""
          echo "React version:"
          npm list react --depth=0 || echo "React version check failed"
          echo ""
          echo "Checking react-native-config installation..."
          if [ -d "node_modules/react-native-config/android" ]; then
            echo "✅ react-native-config Android directory exists"
            ls -la node_modules/react-native-config/android/ | head -5
          else
            echo "❌ react-native-config Android directory missing"
          fi
          echo ""
          echo "Checking project structure..."
          ls -la android/ | head -10
          echo ""
          echo "Checking AndroidManifest.xml package name..."
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            grep -n "package=" android/app/src/main/AndroidManifest.xml || echo "Could not find package name"
          else
            echo "AndroidManifest.xml not found"
          fi
          echo ""
          echo "Checking react-native.config.js..."
          if [ -f react-native.config.js ]; then
            echo "✅ react-native.config.js exists"
            cat react-native.config.js
          else
            echo "❌ react-native.config.js missing"
          fi
          echo ""
          echo "Testing React Native CLI..."
          npx react-native config --platform android > /tmp/rn-config.json 2>&1 && echo "✅ React Native CLI working" || echo "⚠️ React Native CLI failed, checking output..."
          if [ -f /tmp/rn-config.json ]; then
            echo "CLI output:"
            cat /tmp/rn-config.json
          fi
          echo ""
          echo "=== Setup verification complete ==="

      # ------------------------------------
      # Fix Metro compatibility issues
      # ------------------------------------
      - name: Fix Metro compatibility for Node.js 20
        run: |
          echo "Patching Metro config for Node.js 20 compatibility..."
          sed -i 's/configs\.toReversed()/configs.slice().reverse()/g' node_modules/metro-config/src/loadConfig.js
          sed -i 's/reversedConfigs\.toReversed()/reversedConfigs.slice().reverse()/g' node_modules/metro-config/src/loadConfig.js
          echo "Metro config patched successfully"

      # ------------------------------------
      # Ensure autolinking works
      # ------------------------------------
      - name: Ensure autolinking configuration
        run: |
          echo "Checking React Native configuration..."
          echo "Contents of react-native.config.js:"
          cat react-native.config.js
          echo ""
          
          echo "Testing React Native CLI configuration..."
          if npx react-native config --platform android > /tmp/rn-config.json 2>&1; then
            echo "✅ React Native CLI working"
            cat /tmp/rn-config.json
          else
            echo "⚠️ React Native CLI failed, creating fallback configuration..."
            cat > react-native.config.js << 'EOF'
          module.exports = {
          project: {
          android: {
          sourceDir: './android',
          appName: 'app',
          packageName: 'com.appointmentapp',
          },
           },
          };
          EOF
            echo "Created fallback react-native.config.js:"
            cat react-native.config.js
            if npx react-native config --platform android > /tmp/rn-config-fallback.json 2>&1; then
              echo "✅ Fallback configuration working"
              cat /tmp/rn-config-fallback.json
            else
              echo "❌ Fallback configuration also failed"
              cat /tmp/rn-config-fallback.json
            fi
          fi
          
          echo ""
          echo "Ensuring proper package.json configuration..."
          node -e "
            const pkg = require('./package.json');
            console.log('Package name:', pkg.name);
            console.log('React Native version:', pkg.dependencies['react-native']);
          "
          echo ""
          echo "Checking Android project structure..."
          ls -la android/app/src/main/
          echo ""
          echo "Verifying AndroidManifest.xml..."
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            grep -n "package=" android/app/src/main/AndroidManifest.xml || echo "Package attribute not found"
          else
            echo "AndroidManifest.xml not found"
          fi

      # ------------------------------------
      # Android Build based on branch
      # ------------------------------------
      - name: Prepare Android build
        run: |
          echo "Preparing Android build environment..."
          cd android
          echo "Cleaning previous builds..."
          ./gradlew clean --warning-mode none
          chmod +x gradlew
          echo "Gradle wrapper version:"
          ./gradlew --version --warning-mode none
          echo "Android project structure:"
          ls -la app/src/main/
          echo "Skipping autolinking test (not required for build success)"
          echo "Build preparation complete"

      - name: Build Android APK
        run: |
          cd android
          echo "Force regenerating autolinking..."
          ./gradlew clean --warning-mode none
          rm -rf app/build/generated/autolinking
          echo "Building APK with direct assembly task..."
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Building production release APK..."
            ./gradlew assembleProductionRelease --warning-mode none --stacktrace --continue
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "Building staging release APK..."
            ./gradlew assembleStagingRelease --warning-mode none --stacktrace --continue
          else
            echo "Building development debug APK..."
            ./gradlew assembleDevelopmentDebug --warning-mode none --stacktrace --continue
          fi

      - name: Verify APK exists
        run: |
          echo "Checking for built APK files..."
          find android/app/build/outputs/apk -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/*/

      # ------------------------------------
      # Upload Artifact based on branch
      # ------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/app-*.apk