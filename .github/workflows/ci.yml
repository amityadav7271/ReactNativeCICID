name: React Native CI (Env Based)

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  android-build:
    runs-on: ubuntu-latest

    # ✅ GitHub Environment (EXACT MATCH WITH UI)
    environment:
      name: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}

    env:
      NODE_ENV: production

    steps:
      # ------------------------------------
      # Checkout code
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------
      # Set ENV_FILE dynamically based on branch
      # ------------------------------------
      - name: Set ENV_FILE based on branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_FILE=.env.production" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "ENV_FILE=.env.staging" >> $GITHUB_ENV
          else
            echo "ENV_FILE=.env.development" >> $GITHUB_ENV
          fi

      - name: Verify ENV_FILE
        run: |
          echo "ENV_FILE is set to: $ENV_FILE"
          ls -l $ENV_FILE

      - name: Copy env file
        run: |
          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" .env
            echo "Copied $ENV_FILE to .env"
            echo "Contents of .env:"
            cat .env
          else
            echo "Env file $ENV_FILE does not exist!"
            exit 1
          fi

      # ------------------------------------
      # Setup Node.js
      # ------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------
      # Setup Java (Android)
      # ------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------
      # Cache npm
      # ------------------------------------
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ------------------------------------
      # Cache Gradle
      # ------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ------------------------------------
      # Install dependencies
      # ------------------------------------
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ------------------------------------
      # Fix React version compatibility
      # ------------------------------------
      - name: Fix React version compatibility
        run: |
          echo "Installing compatible React version for React Native 0.83..."
          npm install react@18.3.1 react-test-renderer@18.3.1 --legacy-peer-deps
          echo "React version fixed"

      - name: Verify setup
        run: |
          echo "=== Verification Steps ==="
          echo "Node and npm versions:"
          node --version
          npm --version
          echo ""
          echo "React version:"
          npm list react --depth=0 || echo "React version check failed"
          echo ""
          echo "Checking react-native-config installation..."
          ls -la node_modules/react-native-config/android/ | head -5
          echo ""
          echo "Checking project structure..."
          ls -la android/ | head -10
          echo ""
          echo "Checking AndroidManifest.xml package name..."
          grep -n "package=" android/app/src/main/AndroidManifest.xml || echo "Could not find package name"
          echo ""
          echo "Testing React Native CLI after patches..."
          npx react-native config --platform android > /tmp/rn-config.json 2>&1 && echo "✅ React Native CLI working" || echo "⚠️ React Native CLI failed, but build should still work"
          echo ""
          echo "=== Setup verification complete ==="

      # ------------------------------------
      # Fix Metro compatibility issues
      # ------------------------------------
      - name: Fix Metro compatibility for Node.js 20
        run: |
          echo "Patching Metro config for Node.js 20 compatibility..."
          # Replace toReversed() with slice().reverse() for Node.js compatibility
          sed -i 's/configs\.toReversed()/configs.slice().reverse()/g' node_modules/metro-config/src/loadConfig.js
          sed -i 's/reversedConfigs\.toReversed()/reversedConfigs.slice().reverse()/g' node_modules/metro-config/src/loadConfig.js
          echo "Metro config patched successfully"

      # ------------------------------------
      # Ensure autolinking works
      # ------------------------------------
      - name: Ensure autolinking configuration
        run: |
          echo "Checking if React Native CLI can detect Android project..."
          if ! npx react-native config --platform android > /dev/null 2>&1; then
            echo "React Native CLI failed, but autolinking should work during build"
            echo "Ensuring no conflicting react-native.config.js exists..."
            rm -f react-native.config.js
          else
            echo "React Native CLI working correctly"
          fi

      # ------------------------------------
      # Android Build based on branch
      # ------------------------------------
      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Building production release APK..."
            ./gradlew assembleProductionRelease
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "Building staging release APK..."
            ./gradlew assembleStagingRelease
          else
            echo "Building development debug APK..."
            ./gradlew assembleDevelopmentDebug
          fi

      - name: Verify APK exists
        run: |
          echo "Checking for built APK files..."
          find android/app/build/outputs/apk -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/*/

      # ------------------------------------
      # Upload Artifact based on branch
      # ------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/app-*.apk